# Roomz sample MPD config. Roomz does not start MPD.
#
# Install the distro package (`mpd`), edit the absolute paths, create the
# playlist directory, then run: mpd /absolute/path/to/Roomz/mpd/mpd.conf
#
# music_directory must be ROOMZ_LIBRARY_BASE (default: this repo's data/).
# The fifo path must be ROOMZ_FIFO (default: /tmp/roomz-audio.fifo).
# One FIFO output. Browsers play that stream; this machine's speakers do not.

music_directory     "/absolute/path/to/Roomz/data"
playlist_directory  "/absolute/path/to/Roomz/data/playlists"
db_file             "/absolute/path/to/Roomz/data/mpd.db"
state_file          "/absolute/path/to/Roomz/data/mpd.state"
pid_file            "/absolute/path/to/Roomz/data/mpd.pid"
log_file            "syslog"

bind_to_address     "127.0.0.1"
port                "6600"
restore_paused      "yes"
auto_update         "no"
filesystem_charset  "UTF-8"

audio_output {
    type            "fifo"
    name            "Roomz"
    path            "/tmp/roomz-audio.fifo"
    format          "44100:16:2"
}
